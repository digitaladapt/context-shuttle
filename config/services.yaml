# This file is the entry point for all custom service configuration.
parameters:
    env(MCP_SERVER_NAME): 'context-shuttle'
    env(MCP_SERVER_VERSION): '1.0.0'
    env(LOG_LEVEL): 'info'
    env(PENNYTRACK_URL): ''
    env(PENNYTRACK_API_KEY): ''
    env(VITALPULSE_URL): ''
    env(VITALPULSE_API_KEY): ''
    env(CALDAV_URL): ''
    env(CALDAV_USERNAME): ''
    env(CALDAV_PASSWORD): ''
    env(CALDAV_CALENDARS): ''
    env(CALDAV_EDITABLE_CALENDAR): ''
    env(ICS_URL): ''
    env(ICS_NAME): 'ics'
    env(NTFY_URL): ''
    env(NTFY_TOPIC): ''
    env(NTFY_TOKEN): ''
    env(DISCORD_WEBHOOK_URL): ''
    env(DISCORD_MENTION_USER_ID): ''

    # Penny-track tool configuration. Empty defaults keep tool listing
    # working on deployments without penny-track; the tool fails with a
    # clear message when invoked unconfigured.
    pennytrack_url: '%env(string:default::PENNYTRACK_URL)%'
    pennytrack_api_key: '%env(string:default::PENNYTRACK_API_KEY)%'

    # Vital-pulse tool configuration, same pattern as penny-track above.
    vitalpulse_url: '%env(string:default::VITALPULSE_URL)%'
    vitalpulse_api_key: '%env(string:default::VITALPULSE_API_KEY)%'

    # Calendar tool configuration. CALDAV_URL is NOT probed at boot: a
    # calendar server being down must never stop context-shuttle from
    # starting, so the failure belongs at invocation time, with a message
    # naming the env var. CALDAV_PASSWORD may also live in the secrets
    # vault (bin/console secrets:set CALDAV_PASSWORD).
    caldav_url: '%env(string:default::CALDAV_URL)%'
    caldav_username: '%env(string:default::CALDAV_USERNAME)%'
    caldav_password: '%env(string:default::CALDAV_PASSWORD)%'
    caldav_calendars: '%env(string:default::CALDAV_CALENDARS)%'
    # The ONE calendar writes may target. Empty means no write tool is
    # registered at all, which is the opposite default to CALDAV_CALENDARS on
    # purpose: not thinking about reads is harmless, not thinking about writes
    # is not.
    caldav_editable_calendar: '%env(string:default::CALDAV_EDITABLE_CALENDAR)%'
    ics_url: '%env(string:default::ICS_URL)%'
    ics_name: '%env(string:default::ICS_NAME)%'

    # TZ is the deployment's timezone: every timestamp the calendar tools
    # emit is rendered in it, and their date inputs are read in it. An
    # invalid value fails loudly at boot rather than silently falling
    # back to UTC, because a wrong TZ mis-renders every event.
    calendar_timezone: '%env(string:default::TZ)%'

    # Alerts tool configuration (send_alert). Channels are enabled by
    # presence: NTFY_TOPIC turns ntfy on, DISCORD_WEBHOOK_URL turns
    # Discord on — set both to deliver on both. Empty defaults keep
    # tool listing working on unconfigured deployments; invocation
    # fails with a clear message instead.
    ntfy_url: '%env(string:default::NTFY_URL)%'
    ntfy_topic: '%env(string:default::NTFY_TOPIC)%'
    ntfy_token: '%env(string:default::NTFY_TOKEN)%'
    discord_webhook_url: '%env(string:default::DISCORD_WEBHOOK_URL)%'
    discord_mention_user_id: '%env(string:default::DISCORD_MENTION_USER_ID)%'

    # Cross-Origin-Resource-Policy applied to every response by
    # CorsSubscriber when CORS_RESOURCE_POLICY is unset or empty
    # (same-site | same-origin | cross-origin; see .env.example).
    cors_resource_policy: 'same-site'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $serverName: '%env(MCP_SERVER_NAME)%'
            $serverVersion: '%env(MCP_SERVER_VERSION)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Mcp/LoggingDispatcher.php'
            - '../src/Mcp/McpStack.php'
            - '../src/Mcp/YamlToolRegistrar.php'
            - '../src/Mcp/CaptureTransport.php'
            - '../src/ToolRegistry/ToolDefinition.php'
            - '../src/ToolRegistry/ToolDefinitionException.php'
            - '../src/ToolRegistry/ToolLoader.php'
            - '../src/ToolRegistry/ToolRegistryPass.php'
            # Alerts value objects: plain construction-time types, not
            # services (their scalar/array constructors are not
            # autowirable by design).
            - '../src/Tool/Alerts/Priority.php'
            - '../src/Tool/Alerts/OutboundAlert.php'
            - '../src/Tool/Alerts/DeliveryReceipt.php'
            - '../src/Tool/Alerts/DispatchReport.php'

    # ── Controllers ────────────────────────────────────────────────────
    App\Mcp\McpController:
        tags: ['controller.service_arguments']

    App\Rest\ToolRestController:
        tags: ['controller.service_arguments']

    App\Rest\OpenApiController:
        tags: ['controller.service_arguments']

    App\Health\HealthController:
        tags: ['controller.service_arguments']

    # ── MCP wiring ─────────────────────────────────────────────────────
    # The factory assembles the php-mcp Protocol/Dispatcher per request;
    # LoggingDispatcher/YamlToolRegistrar/CaptureTransport are constructed
    # by it directly (excluded from autoregistration above).
    App\Mcp\McpServerFactory:
        arguments:
            $container: '@service_container'
            $logger: '@logger'
            $invocationLogger: '@monolog.logger.mcp_invocation'

    # Tool handlers are resolved by the MCP library through the PSR-11
    # container at call time, so they must stay public (removable
    # inlining breaks ->get() on the compiled container).
    App\Tool\Weather\WeatherTool:
        public: true

    App\Tool\Echo\EchoTool:
        public: true

    App\Tool\PennyTrack\TransactionsTool:
        public: true
        arguments:
            $baseUrl: '%pennytrack_url%'
            $apiKey: '%pennytrack_api_key%'

    App\Tool\VitalPulse\HealthLogsTool:
        public: true
        arguments:
            $baseUrl: '%vitalpulse_url%'
            $apiKey: '%vitalpulse_api_key%'

    # ── Calendar ────────────────────────────────────────────────────────
    App\Calendar\Domain\TimeZoneRule:
        arguments:
            $timeZone: '%calendar_timezone%'

    # The write boundary, as a service because two places need the same
    # answer: `CalDavClient` narrowing `readonly`, and the tool gate deciding
    # whether the write tools exist. Two copies of that answer would be two
    # chances for `readonly: false` and a registered write tool to disagree.
    App\Calendar\Domain\EditableCalendar:
        arguments:
            $configured: '%caldav_editable_calendar%'

    App\Calendar\CalendarWriteGate:
        arguments:
            $editableCalendar: '@App\Calendar\Domain\EditableCalendar'

    App\Calendar\CalDav\CalDavClient:
        arguments:
            $configuredBaseUrl: '%caldav_url%'
            $username: '%caldav_username%'
            $password: '%caldav_password%'
            # Empty means every discovered calendar. A non-empty value is
            # the exposure boundary, so an entry that matches nothing is
            # logged rather than silently serving a narrower listing.
            $allowedCalendars: '%caldav_calendars%'
            $logger: '@monolog.logger.mcp_invocation'
            $editableCalendar: '@App\Calendar\Domain\EditableCalendar'

    # ── Calendar sources ────────────────────────────────────────────────
    # Both sources satisfy one contract, so the reader never learns which
    # it is talking to. A source with no configuration is absent from the
    # list entirely, rather than present and failing on every call.
    App\Calendar\Provider\CalDavProvider:
        tags: ['app.calendar_provider']

    App\Calendar\Provider\IcsProvider:
        tags: ['app.calendar_provider']
        arguments:
            $url: '%ics_url%'
            $name: '%ics_name%'

    App\Calendar\Write\EventWriter:
        arguments:
            $logger: '@monolog.logger.mcp_invocation'

    App\Calendar\CalendarReader:
        arguments:
            $providers: !tagged_iterator app.calendar_provider
            $logger: '@monolog.logger.mcp_invocation'

    # The registry's availability gate is wired here because the registry
    # itself is registered by ToolRegistryPass. Pinned to the calendar gate
    # explicitly rather than autowired: with a second ToolAvailability
    # implementation, autowiring would pick one arbitrarily and the write
    # tools' visibility would depend on service ordering.
    App\ToolRegistry\ToolAvailability: '@App\Calendar\CalendarWriteGate'

    App\Tool\Calendar\ListEventsTool:
        public: true

    App\Tool\Calendar\GetEventTool:
        public: true

    App\Tool\Calendar\ListTasksTool:
        public: true

    App\Tool\Calendar\GetTaskTool:
        public: true

    # Write tools. Public like every other handler — the YAML dispatcher
    # resolves them by name from the container. Their *availability* is a
    # separate question, decided by the gate above: a private service here
    # would still be listed if the gate allowed it, so visibility lives in one
    # place rather than two.
    App\Tool\Calendar\CreateEventTool:
        public: true

    App\Tool\Calendar\UpdateEventTool:
        public: true

    App\Tool\Calendar\DeleteEventTool:
        public: true

    # ── Alerts ─────────────────────────────────────────────────────────
    # send_alert fans out best-effort across every enabled provider; a
    # provider is on iff its required env var is present (presence-based,
    # not selected). Provider scalar config comes from the parameters
    # above; the app.alert_provider tag comes from each provider class's
    # #[AutoconfigureTag] attribute.
    App\Tool\Alerts\AlertTool:
        public: true

    App\Tool\Alerts\NtfyProvider:
        arguments:
            $baseUrl: '%ntfy_url%'
            $topic: '%ntfy_topic%'
            $token: '%ntfy_token%'

    App\Tool\Alerts\DiscordProvider:
        arguments:
            $webhookUrl: '%discord_webhook_url%'
            $mentionUserId: '%discord_mention_user_id%'
