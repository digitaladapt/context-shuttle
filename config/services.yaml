# This file is the entry point for all custom service configuration.
parameters:
    env(MCP_SERVER_NAME): 'context-shuttle'
    env(MCP_SERVER_VERSION): '1.0.0'
    env(LOG_LEVEL): 'info'
    env(PENNYTRACK_URL): ''
    env(PENNYTRACK_API_KEY): ''
    env(VITALPULSE_URL): ''
    env(VITALPULSE_API_KEY): ''
    env(CALDAV_URL): ''
    env(CALDAV_USERNAME): ''
    env(CALDAV_PASSWORD): ''
    env(CALDAV_CALENDARS): ''

    # Penny-track tool configuration. Empty defaults keep tool listing
    # working on deployments without penny-track; the tool fails with a
    # clear message when invoked unconfigured.
    pennytrack_url: '%env(string:default::PENNYTRACK_URL)%'
    pennytrack_api_key: '%env(string:default::PENNYTRACK_API_KEY)%'

    # Vital-pulse tool configuration, same pattern as penny-track above.
    vitalpulse_url: '%env(string:default::VITALPULSE_URL)%'
    vitalpulse_api_key: '%env(string:default::VITALPULSE_API_KEY)%'

    # Calendar tool configuration. CALDAV_URL is NOT probed at boot: a
    # calendar server being down must never stop context-shuttle from
    # starting, so the failure belongs at invocation time, with a message
    # naming the env var. CALDAV_PASSWORD may also live in the secrets
    # vault (bin/console secrets:set CALDAV_PASSWORD).
    caldav_url: '%env(string:default::CALDAV_URL)%'
    caldav_username: '%env(string:default::CALDAV_USERNAME)%'
    caldav_password: '%env(string:default::CALDAV_PASSWORD)%'
    caldav_calendars: '%env(string:default::CALDAV_CALENDARS)%'

    # TZ is the deployment's timezone: every timestamp the calendar tools
    # emit is rendered in it, and their date inputs are read in it. An
    # invalid value fails loudly at boot rather than silently falling
    # back to UTC, because a wrong TZ mis-renders every event.
    calendar_timezone: '%env(string:default::TZ)%'

    # Cross-Origin-Resource-Policy applied to every response by
    # CorsSubscriber when CORS_RESOURCE_POLICY is unset or empty
    # (same-site | same-origin | cross-origin; see .env.example).
    cors_resource_policy: 'same-site'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $serverName: '%env(MCP_SERVER_NAME)%'
            $serverVersion: '%env(MCP_SERVER_VERSION)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Mcp/LoggingDispatcher.php'
            - '../src/Mcp/McpStack.php'
            - '../src/Mcp/YamlToolRegistrar.php'
            - '../src/Mcp/CaptureTransport.php'
            - '../src/ToolRegistry/ToolDefinition.php'
            - '../src/ToolRegistry/ToolDefinitionException.php'
            - '../src/ToolRegistry/ToolLoader.php'
            - '../src/ToolRegistry/ToolRegistryPass.php'

    # ── Controllers ────────────────────────────────────────────────────
    App\Mcp\McpController:
        tags: ['controller.service_arguments']

    App\Rest\ToolRestController:
        tags: ['controller.service_arguments']

    App\Rest\OpenApiController:
        tags: ['controller.service_arguments']

    App\Health\HealthController:
        tags: ['controller.service_arguments']

    # ── MCP wiring ─────────────────────────────────────────────────────
    # The factory assembles the php-mcp Protocol/Dispatcher per request;
    # LoggingDispatcher/YamlToolRegistrar/CaptureTransport are constructed
    # by it directly (excluded from autoregistration above).
    App\Mcp\McpServerFactory:
        arguments:
            $container: '@service_container'
            $logger: '@logger'
            $invocationLogger: '@monolog.logger.mcp_invocation'

    # Tool handlers are resolved by the MCP library through the PSR-11
    # container at call time, so they must stay public (removable
    # inlining breaks ->get() on the compiled container).
    App\Tool\Weather\WeatherTool:
        public: true

    App\Tool\Echo\EchoTool:
        public: true

    App\Tool\PennyTrack\TransactionsTool:
        public: true
        arguments:
            $baseUrl: '%pennytrack_url%'
            $apiKey: '%pennytrack_api_key%'

    App\Tool\VitalPulse\HealthLogsTool:
        public: true
        arguments:
            $baseUrl: '%vitalpulse_url%'
            $apiKey: '%vitalpulse_api_key%'

    # ── Calendar ────────────────────────────────────────────────────────
    App\Calendar\Domain\TimeZoneRule:
        arguments:
            $timeZone: '%calendar_timezone%'

    App\Calendar\CalDav\CalDavClient:
        arguments:
            $configuredBaseUrl: '%caldav_url%'
            $username: '%caldav_username%'
            $password: '%caldav_password%'

    App\Calendar\CalendarReader:
        arguments:
            $logger: '@monolog.logger.mcp_invocation'

    App\Tool\Calendar\ListEventsTool:
        public: true
