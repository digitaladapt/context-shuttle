# Memory forget — the one destructive operation in this family.
#
# `requires: memory_store` — see memory_recall.yaml. The gate matters most
# here: on a deployment with no memory store there is no forget verb for a
# model to find, and on one with a store the tool's description is the only
# warning it gets that this does not demote, retire or archive.
name: memory_forget
description: >-
  Permanently delete a keyword and every sentence stored under it. There is
  no undo and nothing is retained. This removes the key as a whole — its
  sentences, its revision counter and its recorded aliases — so it is the
  right call only when the whole keyword has gone bad. For one wrong
  sentence among good ones, use memory_revise instead: with `disposition:
  purge` it destroys just that sentence, and with the default `demote` it
  merely moves it to cold storage, where it stays retrievable. Those two
  are the only calls that destroy anything, and revise does it one sentence
  at a time. If the only problem is that a fact is old rather than wrong,
  prefer
  memory_remember with mode replace: it retires the current sentences
  instead of destroying them. If no key matches, nothing is deleted and
  the call says so.
requires: memory_store
handler: App\Tool\MemoryDraft\MemoryDraftTool::forget
parameters:
  key:
    type: string
    description: 'The keyword to delete, e.g. "context-shuttle". Spelling variants resolve to the same key, so ContextShuttle deletes what context-shuttle names.'
    required: true
