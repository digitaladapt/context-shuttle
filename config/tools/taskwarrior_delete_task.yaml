# taskwarrior_delete_task — permanently remove a taskwarrior task.
#
# This is destructive: the task is removed from the local database and
# synced out. There is no undo except restoring from a sync-server
# backup. Use taskwarrior_update_task with status=deleted for a
# soft-delete that remains recoverable. A sync runs after deletion if
# TASKCHAMPION_SYNC_URL is configured.
#
# Addressing (bug D in #41): uuid is preferred. Numeric ids renumber
# after every completion or deletion, so an id from a stale list may
# point at the wrong task. Every task object returned by
# taskwarrior_list_tasks carries its uuid.
name: taskwarrior_delete_task
description: >
  Permanently remove a taskwarrior task, addressed by id or uuid (uuid
  preferred — ids renumber as tasks complete). Destructive — no undo
  except from a sync-server backup. Runs a sync after deletion if
  configured.
handler: App\Tool\Taskwarrior\DeleteTaskTool::deleteTask
parameters:
  id:
    type: integer
    description: 'Task id to delete. Optional if uuid is given; ids renumber as tasks complete, so prefer uuid.'
    required: false
    minimum: 1
  uuid:
    type: string
    description: 'Task uuid to delete (preferred over id). Exactly one of id / uuid must be given.'
    required: false
