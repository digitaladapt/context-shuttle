# taskwarrior_update_task — update one or more attributes of a pending
# or completed taskwarrior task by id or uuid.
#
# Only the fields provided are changed; omitted fields are left as-is.
# Pass tags_add / tags_remove to manipulate tags without replacing them
# entirely. Set status to "completed" to complete the task, or "deleted"
# to mark it deleted (soft-delete, still recoverable). For permanent
# deletion use taskwarrior_delete_task instead. A sync runs after the
# update if TASKCHAMPION_SYNC_URL is configured.
#
# Addressing (bug D in #41): uuid is preferred. Numeric ids renumber
# after every completion or deletion, so an id from a stale list may
# point at the wrong task. Every task object returned by
# taskwarrior_list_tasks carries its uuid.
name: taskwarrior_update_task
description: >
  Update one or more attributes of a taskwarrior task, addressed by id
  or uuid (uuid preferred — ids renumber as tasks complete). Only
  provided fields change; omitted fields stay as-is. Sets status to
  completed or deleted, or manipulate tags with tags_add / tags_remove.
  Runs a sync after the update if configured.
handler: App\Tool\Taskwarrior\UpdateTaskTool::updateTask
parameters:
  id:
    type: integer
    description: 'Task id to update. Optional if uuid is given; ids renumber as tasks complete, so prefer uuid.'
    required: false
    minimum: 1
  uuid:
    type: string
    description: 'Task uuid to update (preferred over id). Exactly one of id / uuid must be given.'
    required: false
  description:
    type: string
    description: 'Optional new description.'
    required: false
  project:
    type: string
    description: 'Optional new project name.'
    required: false
  tags_add:
    type: array
    description: 'Optional tags to add (does not remove existing tags).'
    required: false
    items:
      type: string
  tags_remove:
    type: array
    description: 'Optional tags to remove.'
    required: false
    items:
      type: string
  due:
    type: string
    description: 'Optional new due date. ISO YYYY-MM-DD or natural language (e.g. "nov 15", "friday", "tomorrow").'
    required: false
  priority:
    type: string
    description: 'Optional new priority: L (low), M (medium), H (high).'
    required: false
    enum:
      - L
      - M
      - H
  end:
    type: string
    description: 'Optional new deadline (when the task stops being relevant; maps to taskwarrior until). Same format as due.'
    required: false
  status:
    type: string
    description: 'Optional status change: "completed" to complete, "deleted" to soft-delete.'
    required: false
    enum:
      - completed
      - deleted
