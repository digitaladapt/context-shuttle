; context-shuttle PHP runtime configuration
; Baseline for both CLI and FrankenPHP workers.

memory_limit = 256M
upload_max_filesize = 2M
post_max_size = 8M

; Production-friendly opcache
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000

; Expose only minimal info
expose_php = Off

; Timezone default (tools handle their own timezone via Open-Meteo)
date.timezone = UTC

; Logs to stderr for 12-factor
log_errors = On
error_log = /dev/stderr
display_errors = Off